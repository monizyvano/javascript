<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somando valores</title>
    <style>
        body {
            font: normal 20pt Arial, Helvetica, sans-serif;
        }
        input {
            font: normal 18pt Arial, Helvetica, sans-serif;
            width: 100px;
        }
        div#res {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Somando valores</h1>
    <input type="number" name="txtn1" id="txtn1">
    <input type="number" name="txtn2" id="txtn2">
    <input type="button" value="somar" onclick="somar()">
    <div id="res">Resultado</div>

    <script>
        function somar() {
            var tn1 = window.document.getElementById('txtn1')
            var tn2 = window.document.querySelector('#txtn2')
            var res = window.document.getElementById('res')
            var num1 = Number(tn1.value)
            var num2 = Number(tn2.value)
            var s = num1 + num2
            res.innerHTML = `A soma entre ${num1} e ${num2} é igual a ${s}`
        }
    </script>
</body>
</html>
